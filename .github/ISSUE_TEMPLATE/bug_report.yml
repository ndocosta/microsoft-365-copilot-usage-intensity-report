name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include tenant data, credentials, tokens, certificates, or personal information.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Local automation
        - Azure Automation
        - Power BI report
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: Use sanitized values only.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PowerShell or Power BI version
  - type: textarea
    id: logs
    attributes:
      label: Sanitized error output
      render: shell
